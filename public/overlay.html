<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gráficos de la transmisión · Cabina en Vivo</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/stage.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; min-height: 0; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  body.preview { background: repeating-conic-gradient(#2a2f38 0 25%, #20242b 0 50%) 0 0 / 40px 40px; }
  body.camara { background: #000 url(/img/ejemplo-camara.jpg) center / cover; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { subscribe } from '/js/live.js';
import { roomId, qs } from '/js/db.js';
import { anunciar } from '/js/presencia.js';
import { createBanner, createLayers, fitStage, LETREROS, mergeDesign } from '/js/render.js';

if (qs.has('preview')) document.body.classList.add(qs.get('preview') === 'cam' ? 'camara' : 'preview');
const stage = document.getElementById('stage');
fitStage(stage, document.documentElement, { center: qs.get('preview') === 'cam' });
// ?solo=himno (o varios: ?solo=lectura,tema) muestra solo esas piezas, para tener una fuente
// de OBS por letrero. Piezas: los tipos de letrero, "expositor" y "logos". Sin ?solo sale todo.
const solo = qs.get('solo') ? new Set(qs.get('solo').split(',').map(s => s.trim())) : null;
const quiero = k => !solo || solo.has(k);
const layers = quiero('logos') ? createLayers(stage) : null;
// Un letrero por tipo (cita, himno, coro, tema, ubicación, libre), cada uno con su diseño, su lugar y su propio estado.
const tipos = Object.fromEntries(Object.keys(LETREROS).filter(quiero).map(k => [k, createBanner(stage, { kind: 'banner', path: 'letreros.' + k })]));
const speaker = quiero('expositor') ? createBanner(stage, { kind: 'speaker' }) : null;
const seq = {}, timers = {};
let last = null;

// Estado de cada letrero. Las salas guardadas antes de separar los letreros traen uno solo (state.overlay).
function letreros(state) {
  if (state.letreros) return state.letreros;
  const o = state.overlay || {}, t = LETREROS[o.type] ? o.type : 'lectura';
  return { [t]: o };
}
function pinta(key, b, o = {}) {
  clearTimeout(timers[key]);
  const left = o.until ? o.until - Date.now() : Infinity;
  if (!o.visible || left <= 0) { b.hide(); return; }
  if (o.seq !== seq[key]) { seq[key] = o.seq; b.show(o.tag, o.title, { fecha: o.fecha || '', lugar: o.lugar || '' }); }
  if (left !== Infinity) timers[key] = setTimeout(b.hide, left);
}
function show(state) {
  const ls = letreros(state);
  for (const [k, b] of Object.entries(tipos)) pinta(k, b, ls[k]);
  if (speaker) pinta('speaker', speaker, state.speaker);
}
// La vista previa de la cabina no cuenta como OBS.
if (!qs.has('preview') && !qs.has('practica')) anunciar(roomId(), { tipo: 'obs', solo: qs.get('solo') || '' });
subscribe(roomId(), state => { last = state; show(state); }, design => {
  layers?.setDesign(design.layers || {});
  const merged = mergeDesign(design);
  for (const [k, b] of Object.entries(tipos)) b.setDesign(merged.letreros[k]);
  speaker?.setDesign(merged.speaker);
  if (last) { for (const k of Object.keys(seq)) seq[k] = -1; show(last); }
}, { practica: qs.has('practica') });

</script>
</body>
</html>
