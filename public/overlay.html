<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Letrero de la transmisión · Cabina en Vivo</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/stage.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; min-height: 0; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  body.preview { background: repeating-conic-gradient(#2a2f38 0 25%, #20242b 0 50%) 0 0 / 40px 40px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { subscribe } from '/js/live.js';
import { roomId, qs } from '/js/db.js';
import { createBanner, fitStage } from '/js/render.js';

if (qs.has('preview')) document.body.classList.add('preview');
const stage = document.getElementById('stage');
fitStage(stage, document.documentElement, { center: false });
const banner = createBanner(stage);
let seq = -1, hideTimer, last = null;

function show(state) {
  const o = state.overlay || {};
  clearTimeout(hideTimer);
  const left = o.until ? o.until - Date.now() : Infinity;
  if (!o.visible || left <= 0) return banner.hide();
  if (o.seq !== seq) { seq = o.seq; banner.show(o.tag, o.title); }
  if (left !== Infinity) hideTimer = setTimeout(banner.hide, left);
}
subscribe(roomId(), state => { last = state; show(state); }, design => {
  banner.setDesign(design.banner || {});
  if (last) { seq = -1; show(last); }
});
banner.setDesign({});
</script>
</body>
</html>
