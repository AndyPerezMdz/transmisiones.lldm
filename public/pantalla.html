<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantallas del templo · Cabina en Vivo</title>
<link rel="icon" href="/img/icon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/stage.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; min-height: 0; }
  body.oculta-cursor { cursor: none; }
  .aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9; background: rgb(14 23 20 / .92); color: #fff;
    border: 1px solid rgb(194 161 90 / .5); border-radius: 14px; padding: 12px 18px; font: 500 15px/1.4 var(--sans); text-align: center; transition: opacity .4s; }
  .aviso b { color: #e6d5a6; }
</style>
</head>
<body>
<div class="tv" id="stage"></div>
<div class="aviso" id="aviso">Arrastra esta ventana a la TV y presiona <b>F11</b> para pantalla completa.</div>
<script type="module">
import { subscribe } from '/js/live.js';
import { roomId } from '/js/db.js';
import { createScreen, applyScreenDesign, fitStage } from '/js/render.js';

const stage = document.getElementById('stage');
fitStage(stage);
const screen = createScreen(stage);
const embedded = window.self !== window.top;
const aviso = document.getElementById('aviso');
if (embedded) aviso.remove();
// El aviso y el cursor se esconden solos.
let idle;
const wake = () => { document.body.classList.remove('oculta-cursor'); clearTimeout(idle); idle = setTimeout(() => { document.body.classList.add('oculta-cursor'); aviso?.style.setProperty('opacity', '0'); }, 4000); };
addEventListener('mousemove', wake); wake();

subscribe(roomId(), state => screen.render(state), design => { applyScreenDesign(stage, design.screen); screen.refit(); });
screen.render({ item: null, index: 0, blank: false, theme: '' });
</script>
</body>
</html>
